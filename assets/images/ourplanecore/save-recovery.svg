<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Сохранение переносимого проекта OurPlanCore</title>
  <desc id="desc">Изменения сначала попадают в локальную рабочую копию. Успешное Save обновляет файл .ourplan. Его копируют для передачи и бекапа. При ошибке Save локальную recovery сохраняют.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2e7d32"/></marker></defs>
  <rect width="900" height="340" rx="12" fill="#f5f7f5"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#183323">
    <text x="30" y="38" font-size="22" font-weight="600">Рабочая копия и переносимый файл</text>
    <g fill="#fff" stroke="#a8bcab" stroke-width="1.5">
      <rect x="30" y="90" width="238" height="96" rx="8"/>
      <rect x="348" y="90" width="223" height="96" rx="8"/>
      <rect x="651" y="90" width="219" height="96" rx="8"/>
    </g>
    <text x="49" y="121" font-size="19" font-weight="600">Рабочая копия</text>
    <text x="49" y="149" font-size="16">Новые замеры и правки</text>
    <text x="371" y="121" font-size="21" font-weight="600">Проект .ourplan</text>
    <text x="371" y="149" font-size="16">Успешно сохранён</text>
    <text x="672" y="121" font-size="19" font-weight="600">Отдельная копия</text>
    <text x="672" y="149" font-size="16">Передача / бекап</text>
    <g stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"><path d="M268 138H344"/><path d="M571 138H647"/></g>
    <text x="287" y="119" font-size="16">Save</text>
    <text x="579" y="119" font-size="14">Copy</text>
    <rect x="30" y="220" width="840" height="83" rx="8" fill="#fff4dc" stroke="#d6ae5c"/>
    <text x="50" y="252" font-size="18" font-weight="600">Если Save не завершился — сохрани local recovery</text>
    <text x="50" y="281" font-size="16">В ней могут быть изменения, которых ещё нет в файле .ourplan.</text>
  </g>
</svg>
